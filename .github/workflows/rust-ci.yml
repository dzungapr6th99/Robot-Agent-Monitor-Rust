name: Rust CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  rust-ci:
    name: Rust architecture
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        # Set to the Rust workspace path when moving this workflow to a parent repo.
        working-directory: .
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check crate layout and dependencies
        run: python3 .github/scripts/check_architecture.py

      - name: Check struct traits in Business and Infrastructure
        run: |
          python3 -m venv "$RUNNER_TEMP/trait-check"
          "$RUNNER_TEMP/trait-check/bin/python" -m pip install tree-sitter==0.25.2 tree-sitter-rust==0.24.2
          "$RUNNER_TEMP/trait-check/bin/python" .github/scripts/check_traits.py
