[package]
name = "robot-ros-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "sync"] }
robot-common-lib = { path = "../../Entities/CommonLib" }
robot-ros2-interface-message = { path = "../../Entities/Ros2InterfaceMessage" }

rclrs = { version = "0.8", optional = true, features = ["serde"] }
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = []
ros2 = ["dep:rclrs", "robot-ros2-interface-message/ros2"]
camera-ros = ["ros2", "robot-ros2-interface-message/camera-ros"]
