[package]
name = "robot-third-party-client"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
robot-common-lib = { path = "../../Entities/CommonLib" }

ort = { version = "2.0.0-rc.10", optional = true, default-features = false, features = ["load-dynamic"] }
tokenizers = { version = "0.21", optional = true, default-features = false, features = ["fancy-regex"] }
image = { version = "0.25", optional = true, default-features = false }

[features]
default = []
onnx = ["dep:ort", "dep:tokenizers", "dep:image"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
