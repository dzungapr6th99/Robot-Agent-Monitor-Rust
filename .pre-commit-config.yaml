repos:
  - repo: local
    hooks:
      - id: robot-monitor-layout
        name: Robot monitor crate layout and dependencies
        entry: python .github/scripts/check_architecture.py
        language: python
        pass_filenames: false
        always_run: true

      - id: robot-monitor-traits
        name: Robot monitor struct traits and trait placement
        entry: python .github/scripts/check_traits.py
        language: python
        additional_dependencies:
          - tree-sitter==0.25.2
          - tree-sitter-rust==0.24.2
        pass_filenames: false
        always_run: true
